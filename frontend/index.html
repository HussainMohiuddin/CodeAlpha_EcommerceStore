<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeAlpha Store - Home</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="nav-placeholder"></div>

  <main class="container">
    <h1>Shop our products</h1>
    <p class="muted">Browse the catalog, add items to your cart, and check out securely.</p>

    <div class="toolbar">
      <input type="text" id="search-input" class="input" placeholder="Search products..." />
      <select id="category-filter" class="input">
        <option value="">All categories</option>
      </select>
    </div>

    <div id="status-message" class="muted"></div>
    <div id="products-grid" class="grid"></div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
