<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UrbanCart - Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="nav-placeholder"></div>

  <section class="hero">
    <div class="hero-inner">
      <h1>Everything you need, one cart away.</h1>
      <p>Electronics, clothing, footwear, home &amp; accessories — all in one place.</p>
    </div>
  </section>

  <main class="container">
    <div class="toolbar">
      <input type="text" id="search-input" class="input" placeholder="Search products..." />
      <select id="category-filter" class="input">
        <option value="">All categories</option>
      </select>
    </div>

    <div id="status-message" class="muted"></div>
    <div id="products-grid" class="grid"></div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
